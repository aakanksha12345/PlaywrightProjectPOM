
name: Playwright UI Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Run smoke suite
        run: npm run test:smoke
        env:
          PARABANK_USERNAME: ${{ secrets.PARABANK_USERNAME }}
          PARABANK_PASSWORD: ${{ secrets.PARABANK_PASSWORD }}

      - name: Save failure artifacts and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: parabank-demo-regression
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run regression tests
        run: npx playwright test tests/transferFunds.spec.ts --project=chromium --workers=1
        env:
          PARABANK_USERNAME: ${{ secrets.PARABANK_USERNAME }}
          PARABANK_PASSWORD: ${{ secrets.PARABANK_PASSWORD }}

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
